[build]
  command = "pnpm build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # Netlify's secret scanning found secret values inside Turbopack's build
  # cache (.next/cache/turbopack/*.sst), which is kept between builds and
  # never published. Only the cache is skipped: the published output and
  # the repository are still scanned.
  SECRETS_SCAN_OMIT_PATHS = ".netlify/.next/cache/**,.next/cache/**"

# Google Analytics 4 (E5-04): production only, so previews send nothing. The
# measurement ID is public; it ends up in every page anyway.
[context.production.environment]
  NEXT_PUBLIC_GA_ID = "G-BSPLL130VD"

# The site was created for the previous Vue app, so Netlify never auto-installed
# the Next.js adapter. Declare it explicitly (version pinned in package.json).
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Netlify Image CDN may fetch the Storage images: the blog feed offers each
# cover as a JPEG for Instagram through /.netlify/images (Make).
[images]
  remote_images = ['https://thbqjhnfvxummwnniicg\.supabase\.co/storage/v1/object/public/images/.*']
