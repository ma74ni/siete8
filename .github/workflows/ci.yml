name: CI

on:
  pull_request:
    branches: [dev, master]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: CI
    runs-on: ubuntu-latest
    env:
      # Not a secret: required by the env validation in next.config.ts.
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Format
        run: pnpm format:check

  database:
    name: Database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Applies every migration and the seed. Auth and Storage stay on because
      # migrations and RLS policies reference their schemas.
      - name: Start Supabase
        run: pnpm exec supabase start -x realtime,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Lint database
        run: pnpm exec supabase db lint --level error --fail-on error

      - name: Test database
        run: pnpm db:test
