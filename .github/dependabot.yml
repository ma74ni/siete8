# Dependency updates go to dev, like every other change: they get a deploy
# preview and reach production with the next dev → master release. Without
# this file Dependabot targets master, and its lockfile changes made dev and
# master diverge (#92, #119). Security updates always target the default
# branch; GitHub does not let this file change that.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
